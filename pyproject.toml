[project]
name = "skytrace"
version = "0.1.0"
description = "PX4 / ArduPilot flight log analysis, anomaly detection and Q&A"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "jinja2>=3.1.6",
    "langgraph>=1.2.16",
    "litellm>=1.106.2",
    "mcp>=2.3.0",  # imported by litellm.completion whenever tools= is passed (litellm 1.106)
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=7.1.0",
    "pymavlink>=2.4.41",
    "pyulog>=1.1",
    "pyyaml>=6.0",
    "qdrant-client>=1.20.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "typer>=0.27.3",
]

[project.scripts]
skytrace = "skytrace.cli:app"

[project.optional-dependencies]
web = [
    "fastapi>=0.162.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "skytrace[web]",  # the API tests need the web extra
    "httpx>=0.28.1",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]
eval = [
    "matplotlib>=3.11.2",
]

[tool.uv]
# mypy checks the eval/ scripts too, so plain `uv sync` installs their group.
default-groups = ["dev", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skytrace"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["PX4-Autopilot"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "RUF001"]  # Turkish example questions use dotless i

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "eval"]

[[tool.mypy.overrides]]
module = "skytrace.*"
strict = true

# tests/: normal mode (unannotated test functions allowed, bodies still checked)
[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pyulog", "pyulog.*", "pymavlink", "pymavlink.*", "plotly", "plotly.*", "sklearn", "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
