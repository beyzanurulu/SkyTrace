[project]
name = "skytrace"
version = "0.1.0"
description = "PX4 / ArduPilot flight log analysis, anomaly detection and Q&A"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "jinja2>=3.1.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=7.1.0",
    "pyulog>=1.1",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]
eval = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skytrace"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "eval"]

[[tool.mypy.overrides]]
module = "skytrace.*"
strict = true

# tests/: normal mode (unannotated test functions allowed, bodies still checked)
[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pyulog", "pyulog.*", "pymavlink", "pymavlink.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
