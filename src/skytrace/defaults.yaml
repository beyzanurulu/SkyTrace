# SkyTrace default configuration.
# Every value here is documented in docs/thresholds.md.
# Override with a user YAML file; only the keys you set are replaced.

parser:
  # Max time gap (s) when aligning a slower topic (setpoints, clip counters)
  # onto a faster time base. Farther samples become NaN instead of stale values.
  merge_tolerance_s: 0.5

  # Same, for ~1 Hz status topics (vehicle_imu_status vibration metrics).
  status_tolerance_s: 1.5

  # Rolling window (s) for the per-axis accelerometer standard deviation
  # used as vib_x / vib_y / vib_z on PX4 logs.
  vibration_window_s: 0.5

  motors:
    # Read PWM_MAIN_MINn / PWM_MAIN_MAXn / PWM_MIN / PWM_MAX from the log first.
    use_log_params: true
    # Fallback PWM range (microseconds) when the log has no usable params.
    pwm_min_us: 1000
    pwm_max_us: 2000
    # Number of motors. null = CA_ROTOR_COUNT from the log, else all outputs.
    count: null

detectors:
  # Only look at samples while the vehicle is armed (from arm/disarm events).
  # Logs without arm/disarm events are analyzed in full.
  only_when_armed: true
  # Violations separated by less than this gap (s) are merged into one finding.
  merge_gap_s: 0.5

  vibration:
    # Checks vibration.accel_vib_metric and clip_count. Their scale depends on the
    # source (LogMetadata.vib_metric_source), so each source has its own block and
    # a log is only ever compared with the thresholds of its own source.
    # metric_warn / metric_critical: null = not calibrated, check skipped (with a note).
    min_duration_s: 1.0
    # Clipping bursts closer than this (s) are reported as one finding.
    clip_merge_gap_s: 5.0

    px4_imu_status:
      # PX4 vehicle_imu_status.accel_vibration_metric (max over IMU instances).
      # Calibrated with eval/calibrate_vibration.py, see the comment below once run.
      metric_warn: null
      metric_critical: null
      # Any clipping while armed is a warning; this many clipped samples (sum of
      # axes, max over IMUs) within one finding make it critical. Heuristic.
      clip_critical_count: 100

    ardupilot_vibe:
      # ArduPilot VIBE (max of VibeX/Y/Z, m/s^2). ArduPilot guidance: < 30 acceptable,
      # > 30 may cause problems, > 60 almost always does.
      metric_warn: 30.0
      metric_critical: 60.0
      # VIBE Clip0/1/2 (max over IMUs). Heuristic.
      clip_critical_count: 100

  gps:
    # fix_type below this (3 = 3D fix) while armed: critical if the fix was lost,
    # warn if the vehicle armed before acquiring a fix.
    min_fix_type: 3
    # PX4 EKF2_REQ_NSATS / EKF2_REQ_EPH defaults.
    min_satellites: 6
    max_eph_m: 3.0
    # Adapted from PX4 EKF2_REQ_PDOP (2.5); HDOP <= PDOP.
    max_hdop: 2.5
    min_duration_s: 1.0
    # No GPS sample for longer than this (s) while armed = GPS data lost (receiver
    # dropout / disconnect / PX4 "failure gps off"). The last sample before such a
    # gap still reports a valid fix, so the fix check alone cannot see it. Heuristic:
    # well above normal logging intervals (1 Hz for sensor_gnss, 5-30 Hz otherwise).
    max_data_gap_s: 3.0

  battery:
    # Cell count. null = from the log (battery_status.cell_count / BAT1_N_CELLS);
    # if still unknown, per-cell checks are skipped.
    cells: null
    # Per-cell voltage (V).
    cell_voltage_warn: 3.5
    cell_voltage_critical: 3.3
    # Voltage drop below the rolling max over sag_window_s, per cell (V).
    # 0.3 V matches PX4's BAT_V_LOAD_DROP default; 0.5 V is a heuristic.
    sag_window_s: 2.0
    sag_warn_v_per_cell: 0.3
    sag_critical_v_per_cell: 0.5
    # Sag is short by nature; 0 = a single sample is enough.
    sag_min_duration_s: 0.0
    # Remaining fraction. PX4 BAT_LOW_THR / BAT_CRIT_THR defaults.
    remaining_warn: 0.15
    remaining_critical: 0.07
    min_duration_s: 1.0

  attitude:
    # |setpoint - actual| for roll and pitch (degrees). Heuristic.
    error_warn_deg: 10.0
    error_critical_deg: 20.0
    min_duration_s: 1.0

  motors:
    # Normalized output at or above this level counts as saturated.
    saturation_level: 0.95
    # Saturated for at least this long (s) -> warn / critical. Heuristic.
    saturation_warn_s: 0.5
    saturation_critical_s: 2.0
    # One motor's rolling mean deviating from the mean of all motors.
    imbalance_window_s: 5.0
    imbalance_warn: 0.15
    imbalance_critical: 0.25
    imbalance_min_duration_s: 5.0

report:
  # Evidence plots show the finding interval plus this much context (s) on each side.
  evidence_padding_s: 10.0
  # Long series are reduced to at most this many points per trace (min/max per
  # bucket, so short peaks survive). Keeps 50 MB logs from producing huge reports.
  max_points_per_trace: 4000

anomaly:
  # ML anomaly detection (skytrace.anomaly.ml), off by default: run_detectors(ml=True)
  # or `skytrace analyze --ml`. Unsupervised within one log, no training data.
  # zscore.info/warn and iforest.min_feature_z/warn_feature_z are calibrated on
  # clean real flights (see their comments); the rest are heuristic.
  # Armed samples are binned onto a common grid at this rate (Hz) ...
  resample_hz: 10.0
  # ... and gaps up to this long (s) are forward-filled (1 Hz status topics).
  max_fill_s: 2.0
  # Analysis covers armed, in-air time (takeoff / landing events), split at mode
  # changes; this long (s) is skipped at both ends of each segment (lift-off,
  # touchdown, mode-switch transients).
  trim_s: 5.0

  # Signal -> noise floor (signal units) for the robust z-score; null disables it.
  signals:
    roll_error_deg: 1.0     # |roll setpoint - roll| (deg)
    pitch_error_deg: 1.0
    accel_vib_metric: 0.5   # vibration metric (source units)
    battery_voltage: 0.05   # V
    battery_current: 0.5    # A
    motor_mean: 0.02        # mean normalized motor output
    motor_spread: 0.02      # max - min motor output
    vz: 0.2                 # vertical velocity (m/s)
    gps_eph: 0.2            # m, only while the GPS fix is valid

  zscore:
    # Robust z = (x - rolling median) / max(1.4826 * rolling MAD, noise floor),
    # over the trailing window_s seconds (past only: an onset is flagged when it
    # happens, not one window earlier).
    window_s: 30.0
    # Calibrated 2026-10-21 with eval/calibrate_ml.py (eval/results/ml_calibration.json):
    # P80 / P95 of the per-log max sustained |z| over 28 clean real PX4 quadrotor
    # flights (Flight Review, no error label, rated good/great; SITL/HITL excluded),
    # split by vehicle_uuid. Test half (31 flights): info on 19 %, warn on 10 %.
    info: 13.3              # |z| above this for min_duration_s -> info finding
    warn: 25.0              # ... and above this anywhere inside -> warn
    min_duration_s: 1.0

  iforest:
    # Off by default: calibrated on clean real flights it still fired on 32 % of
    # the test flights (see min_feature_z below), i.e. normal manoeuvres look
    # anomalous. The rolling z-score above stays on. Set true to try it.
    enabled: false
    # Isolation Forest, one per flight mode, on sliding windows. Features per
    # signal: level (window mean minus the median of the window means within
    # +-baseline_s / 2, so slow trends like battery discharge are not anomalies),
    # std, slope and the share of spectral energy above hf_cutoff_hz.
    window_s: 5.0
    step_s: 2.5
    baseline_s: 60.0
    hf_cutoff_hz: 1.0
    n_estimators: 200
    contamination: 0.02     # expected share of anomalous windows in a log
    random_state: 0         # fixed: the same log always gives the same result
    min_windows: 20         # fewer windows than this -> skipped (note)
    # contamination alone flags the most extreme windows of *every* log, and the
    # forest's score is a weak gate (adjacent anomalous windows mask each other).
    # So a window is only reported if its most deviating feature has a robust z
    # (vs. the median / IQR of all windows of that mode) of at least min_feature_z.
    # Calibrated 2026-10-21 with eval/calibrate_ml.py: P80 / P95 of the per-log max
    # feature |z| of flagged windows over the same 28 clean flights. Generalises
    # poorly: on the 31 test flights info fires on 32 %, warn on 13 % (targets
    # 20 % / 5 %), because real-flight variability already yields |z| ~ 30-150.
    min_feature_z: 59.7
    warn_feature_z: 91.1    # ... and from this |z| on the finding is a warning
    top_features: 3         # most deviating features named in the summary
