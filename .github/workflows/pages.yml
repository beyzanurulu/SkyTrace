# GitHub Pages: landing page + sample flight reports (deploy/pages/build.py).
# One-time setup: Settings -> Pages -> Source: GitHub Actions. The live demo
# button appears once the repository variable DEMO_URL is set
# (Settings -> Secrets and variables -> Actions -> Variables).
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --no-default-groups
      - run: uv run python deploy/pages/build.py --out site --demo-url "${{ vars.DEMO_URL }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
