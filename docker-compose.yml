# Ollama + SkyTrace, offline mode. The first start downloads the models into
# the "ollama-models" volume (the only step that needs the internet); after
# that the stack runs without it. Documentation index: build it once on the
# host (`skytrace docs build`), it is mounted from ./data.
#
#   docker compose up --build        -> http://127.0.0.1:8000
#   GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  ollama:
    image: ollama/ollama:0.40.7
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30

  models:  # one-off: pull the chat and embedding models
    image: ollama/ollama:0.40.7
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull qwen2.5:7b && ollama pull bge-m3"]
    restart: "no"

  skytrace:
    build: .
    image: skytrace:local
    depends_on:
      models:
        condition: service_completed_successfully
    environment:
      SKYTRACE_MODE: offline
    command: ["skytrace", "serve", "-c", "/app/docker/compose.yaml"]
    ports:
      - "127.0.0.1:8000:8000"  # reachable from this machine only
    volumes:
      - ./data:/app/data  # uploads + documentation index

volumes:
  ollama-models:
