# Ten example questions for the Q&A agent and the expected behaviour, on the
# test fixture tests/fixtures/sample_log_small.ulg (PX4 VTOL, 6.5 s, findings
# F001 gps EPH 0.2-1.7 s and F002 pitch tracking 3.3-4.8 s).
#
# - tests/test_agent.py replays `script` with a scripted model (no LLM needed).
# - eval/agent_eval.py asks the real model the same questions.
# Both score with skytrace.evaluation.agent_questions.check_reply.
#
# script items: {tool: <name>, args: {...}}  or  {answer: "..."}  (last item)
# expect:
#   tools: tools that must be called; an item can be a list of alternatives
#   verified: true -> every number / finding id backed by a tool output;
#             false -> exactly `unverified` / `unknown_ids` must be flagged
#   key_numbers / key_ids / key_terms_any: facts the answer must contain, so that
#             "no data found" cannot pass just by containing no number

questions:
  - id: findings_overview
    question: "Bu uçuşta hangi sorunlar tespit edildi?"
    script:
      - {tool: list_findings, args: {}}
      - answer: "İki uyarı var: F001 (0.2-1.7 s) GPS EPH 3.26 m'ye çıktı (eşik 3.0 m); F002 (3.3-4.8 s) pitch takip hatası 19.9° (eşik 10.0°)."
    expect: {tools: [list_findings], verified: true, key_ids: [F001, F002]}

  - id: duration
    question: "Uçuş ne kadar sürdü?"
    script:
      - {tool: get_flight_summary, args: {}}
      - answer: "Log 6.5 saniye sürüyor."
    expect: {tools: [get_flight_summary], verified: true, key_numbers: [6.51379]}

  - id: gps_problem
    question: "GPS'te bir sorun var mı?"
    script:
      - {tool: list_findings, args: {detector: gps}}
      - answer: "Evet: F001, 0.2-1.7 s arasında EPH 3.26 m'ye çıktı (eşik 3.0 m)."
    expect: {tools: [list_findings], verified: true, key_ids: [F001]}

  - id: pitch_error_window
    question: "3 ile 5. saniyeler arasında en büyük pitch takip hatası ne kadardı ve ne zaman?"
    script:
      - {tool: query_series, args: {table: signals, columns: [pitch_error_deg], t_start: 3, t_end: 5}}
      - answer: "En büyük pitch takip hatası 19.9°, 3.44 s'de."
    expect: {tools: [query_series], verified: true, key_numbers: [19.9343, 3.43924]}

  - id: battery_min
    question: "Batarya voltajı en düşük kaç volta indi, kalan kapasite ne kadardı?"
    script:
      - {tool: query_series, args: {table: battery, columns: [voltage, remaining]}}
      - answer: "En düşük voltaj 23,34 V (1.22 s); kalan kapasite yaklaşık %74."
    expect: {tools: [query_series], verified: true, key_numbers: [23.3362]}

  - id: flight_modes
    question: "Drone hangi modda uçtu?"
    script:
      - {tool: get_flight_summary, args: {}}
      - answer: "Log boyunca tek mod var: MANUAL."
    expect: {tools: [[get_flight_summary, get_events]], verified: true, key_terms_any: [MANUAL]}

  - id: takeoff_landing
    question: "Ne zaman kalktı ve ne zaman indi?"
    script:
      - {tool: get_events, args: {kinds: [takeoff, landing]}}
      - answer: "Kalkış 2.36 s'de, iniş 3.51 s'de."
    expect: {tools: [get_events], verified: true, key_numbers: [2.36469, 3.51336]}

  - id: vibration_not_checked
    question: "Titreşim seviyesi normal mi?"
    script:
      - {tool: get_flight_summary, args: {}}
      - answer: "Titreşim seviyesi kontrol edilmedi: PX4 için kalibre edilmiş eşik yok. Bulgu olmaması titreşimin normal olduğu anlamına gelmez."
    expect:
      tools: [[get_flight_summary, list_findings, query_series]]
      verified: true
      key_terms_any: [kalibre, "kontrol edil", calibrat, "not checked", skipped, atlan]

  - id: out_of_scope
    question: "Yarın İstanbul'da hava nasıl olacak?"
    script:
      - answer: "Sadece bu uçuş logu hakkındaki soruları yanıtlayabilirim."
    expect: {tools: [], no_tools: true, verified: true, no_numbers: true}

  - id: hallucinated_numbers
    # The scripted answer invents a motor number, a value and a finding id: all flagged.
    # (Motor 9: a small integer that happens to occur in the context, e.g. a 3.0
    # threshold, would count as backed; a known limit, see docs/thresholds.md.)
    # (Replay only: a real model is not expected to reproduce this answer.)
    question: "Motorlarda sorun var mı?"
    script:
      - {tool: list_findings, args: {detector: motors}}
      - answer: "Motor 9 yüzde 98 doygunluğa ulaştı (F007)."
    expect: {tools: [list_findings], verified: false, unverified: ["9", "98"], unknown_ids: [F007]}
    replay_only: true
